<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User</title>
</head>
<body>

<p th:text="${user.getLogin}">VALUE</p>
<hr/>
<p th:text="${user.getId()} + '. ' + ${user.getFirstName()} + ' ' + ${user.getLastName}">VALUE</p>
<p th:text="${user.getAge()} + ' years.'">VALUE</p>
<p th:text="${user.getEmail()}">VALUE</p>

</body>
</html>
