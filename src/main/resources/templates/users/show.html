<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/user/show.css}" rel="stylesheet"/>
</head>
<body>

<div class="container">
    <div class="row row-head">
        <p class="email" th:text="${user.getEmail()}">VALUE</p>
        <form class="logout" th:action="@{/logout}" th:method="POST">
            <input type="submit" value="Logout"/>
        </form>
    </div>

    <div class="row">
        <div class="col-2 col-left">
            <h>User</h>
        </div>
        <div class="col-10 col-table">
            <div class="row">
                <h3>User information-page </h3>
            </div>
            <div class="container container_about_user">
                <div class="row row_about-user">
                    <h class="text_about-user"> About user</h>
                </div>
                <div class="row row__user_table">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th scope="col">ID</th>
                                <th scope="col">First Name</th>
                                <th scope="col">Last Name</th>
                                <th scope="col">Age</th>
                                <th scope="col">Email</th>
                                <th scope="col">Role</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <th scope="row" th:text="${user.getId()}">id</th>
                                <td th:text="${user.getFirstName()}">first name</td>
                                <td th:text="${user.getLastName()}">last name</td>
                                <td th:text="${user.getAge()}">age</td>
                                <td th:text="${user.getEmail()}">email</td>
                                <td>
                                    <span th:each="role, iter : ${roles}">
                                        <span th:text="${role.authority}">ROLE_ADMIN</span>
                                        <span th:unless="${iter.last}">, </span>
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

</div>

</body>
</html>
