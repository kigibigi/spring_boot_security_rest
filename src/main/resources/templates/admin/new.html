<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>New user</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/admin/new.css}" rel="stylesheet"/>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<div class="container">

    <div class="row row-head align">
        <p class="email" th:text="${admin.getEmail()}">VALUE</p>
        <form class="logout" th:action="@{/logout}" th:method="POST">
            <input type="submit" value="Logout"/>
        </form>
    </div>
</div>

<div class="row">
    <!--
            Навигация (панель слева)
    -->
    <div class="col-2">
        <ul class="nav flex-column nav-pills">
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link active" aria-current="page" href="/admin">Admin</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('USER')">
                <a class="nav-link" aria-current="page" href="/user/myPage">User</a>
            </li>
        </ul>
    </div>


    <!--
            Панель админа/юзера
    -->
    <div class="col-10">
        <div class="row">
            <h3> Admin panel </h3>
        </div>

        <div class="row">


            <!--  Создание пользователя и таблица-->
            <ul class="nav nav-tabs">
                <li class="nav-item">
                    <a class="nav-link" aria-current="page" href="/admin"> Users table </a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active disabled" aria-current="page" href="new.html">New user</a>
                </li>
            </ul>
            <hr>
        </div>

        <div class="row">
            <h> Add new user </h>
            <hr>
        </div>
        <form th:method="POST" th:action="@{/admin}" th:object="${user}">
            <label for="login"> Login : </label>
            <input type="text" th:field="*{login}" id="login">
            <br/>
            <label for="email"> Password : </label>
            <input type="password" th:field="*{password}" id="password">
            <br/>
            <hr/>
            <label for="firstName">First Name : </label>
            <input type="text" th:field="*{firstName}" id="firstName">
            <br/><label for="lastName">Last Name : </label>
            <input type="text" th:field="*{lastName}" id="lastName">
            <br/>
            <label for="age">Age : </label>
            <input type="text" th:field="*{age}" id="age">
            <br/>
            <label for="email">Email : </label>
            <input type="text" th:field="*{email}" id="email">
            <br/>
            <label for="role">Role : </label>
            <select id="role" name="role" class="form-select" size="2">
                <div th:each="role : ${roles}">
                    <option selected th:text="${role.getNameRole()}"/>
                </div>
            </select>
<!--            <label for="role">Role : </label>-->
<!--            <input type="text" th:field="*{role}" id="role">-->
<!--            <br/>-->
            <input type="submit" value="Create!">
        </form>
    </div>
</div>
</body>
</html>
