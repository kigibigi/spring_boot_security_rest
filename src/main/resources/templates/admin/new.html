<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>New user</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/admin/new.css}" rel="stylesheet"/>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<div class="container">

    <div class="row row-head align">
        <div class="d-flex align-items-center text_head">
            <span class="email" th:text="${admin.getEmail()}">VALUE</span>
            <span> with roles:</span>
            <span th:each="role, iter : ${admin.roles}">
                    <span th:text="${role.getNameRole()}">ROLE</span>
                    <span th:unless="${iter.last}"> </span>
                </span>
        </div>

        <form class="logout" th:action="@{/logout}" th:method="POST">
            <input type="submit" value="Logout"/>
        </form>
    </div>

    <div class="row row-body">
        <!--            Навигация       -->
        <div class="col-2 col_navigation">
            <ul class="nav flex-column nav-pills">
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link active" aria-current="page" href="/admin">Admin</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('USER')">
                    <a class="nav-link" aria-current="page" href="/user/myPage">User</a>
                </li>
            </ul>
        </div>

        <div class="col-10 col_table">

            <div class="row row_heading">
                <h2> Admin panel </h2>
            </div>


            <!--
                                Горизонтальная навигация (создание пользователя и таблица)
            -->
            <div class="row">
                <ul class="nav nav-tabs">
                    <li class="nav-item">
                        <a class="nav-link" aria-current="page" href="/admin"> Users table </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active disabled" aria-current="page" href="/admin/new">New user</a>
                    </li>
                </ul>
            </div>

            <div class="row row_name_table">
                <h5> Add new user </h5>
            </div>

<!--            Окно добавления юзера           -->
            <div class="row row_window_add_user">
                <div class="col-3 col_left"></div>


                <div class="col-6 col_middle">
                    <form th:method="POST" th:action="@{/admin}" th:object="${user}">
                        <div class="mb-3">
                            <label for="firstName">First Name </label>
                            <input type="text" th:field="*{firstName}" id="firstName">
                        </div>
                        <div class="mb-3">
                            <label for="lastName">Last Name </label> <br>
                            <input type="text" th:field="*{lastName}" id="lastName">
                        </div>
                        <div class="mb-3">
                            <label for="age">Age </label> <br>
                            <input type="text" th:field="*{age}" id="age">
                        </div>
                        <div class="mb-3">
                            <label for="email">Email </label> <br>
                            <input type="text" th:field="*{email}" id="email">
                        </div>
                        <div class="mb-3">
                            <label for="email"> Password </label> <br>
                            <input type="password" th:field="*{password}" id="password">
                        </div>
                        <div class="mb-3">
                            <label for="role"> Role </label> <br>
                            <select id="role" name="role" class="form-select" size="2">
                                <div class="without_margin" th:each="role : ${roles}">
                                    <option selected th:text="${role.getNameRole()}"/>
                                </div>
                            </select>
                        </div>
                        <button type="submit" class="btn btn-success">Add new User!</button>
                    </form>
                </div>


                <div class="col-3 col_right"></div>

            </div>

        </div>
    </div>
</div>



</body>
</html>
