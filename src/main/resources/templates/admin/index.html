<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org" xmlns="http://www.w3.org/1999/html"
      xmlns:sec="http://www.w3.org/1999/xhtml">

<head>
    <meta charset="UTF-8">
    <title>All users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link th:href="@{/css/admin/index.css}" rel="stylesheet"/>
    <script th:src="@{/js/admin/editUserModal.js}"></script>
    <script th:src="@{/js/admin/deleteUserModal.js}"></script>
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

    <div class="container">

        <div class="row row-head align">
            <div class="d-flex align-items-center text_head">
                <span class="email" th:text="${admin.getEmail()}">VALUE</span>
                <span> with roles:</span>
                <span th:each="role, iter : ${admin.roles}">
                    <span th:text="${role.getNameRole()}">ROLE</span>
                    <span th:unless="${iter.last}"> </span>
                </span>
            </div>

            <form class="logout" th:action="@{/logout}" th:method="POST">
                <input type="submit" value="Logout"/>
            </form>
        </div>
    </div>

        <div class="row row-body">
<!--            Навигация       -->
            <div class="col-2 col_navigation">
                <ul class="nav flex-column nav-pills">
                    <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                      <a class="nav-link active" aria-current="page" href="/admin">Admin</a>
                    </li>
                    <li class="nav-item" sec:authorize="hasRole('USER')">
                        <a class="nav-link" aria-current="page" href="/user/myPage">User</a>
                    </li>
                </ul>
            </div>

            <div class="col-10 col_table">

                <div class="row row_heading">
                    <h2> Admin panel </h2>
                </div>


<!--
                    Горизонтальная навигация (создание пользователя и таблица)
-->
                <div class="row">
                <ul class="nav nav-tabs">
                        <li class="nav-item">
                            <a class="nav-link active disabled" aria-current="page" href="index.html"> Users table </a>
                        </li>

                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="/admin/new">New user</a>
                        </li>
                    </ul>
                </div>


                <div class="row row_name_table">
                    <h5> All users </h5>
                </div>

                <div class="row row_table">
                    <table class="table table-striped">
                        <thead>
                        <tr>
                            <th scope="col">ID</th>
                            <th scope="col">First Name</th>
                            <th scope="col">Last Name</th>
                            <th scope="col">Age</th>
                            <th scope="col">Email</th>
                            <th scope="col">Role</th>
                            <th scope="col">Edit</th>
                            <th scope="col">Delete</th>
                        </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}">
                                <th scope="row" th:text="${user.getId()}">id</th>
                                <td th:text="${user.getFirstName()}">first name</td>
                                <td th:text="${user.getLastName()}">last name</td>
                                <td th:text="${user.getAge()}">age</td>
                                <td th:text="${user.getEmail()}">email</td>
                                <td>
                                     <span th:each="role, iter : ${user.roles}">
                                        <span th:text="${role.getNameRole()}">ROLE</span>
                                        <span th:unless="${iter.last}"> </span> <!-- пробел вместо запятой -->
                                    </span>
                                </td>
                                <td>
                                    <button type="button"
                                            class="btn btn-primary edit-user-btn"
                                            th:data-user-id="${user.getId()}"
                                            th:data-user-firstname="${user.getFirstName()}"
                                            th:data-user-lastname="${user.getLastName()}"
                                            th:data-user-age="${user.getAge()}"
                                            th:data-user-email="${user.getEmail()}"
                                            data-bs-toggle="modal"
                                            data-bs-target="#updateUserModal">
                                        Edit
                                    </button>
                                </td>
                                <td>
<!--                                    <form th:method="DELETE" th:action="@{/admin?id={id}(id=${user.getId()})}">-->
<!--                                        <input type="submit" value="Delete!">-->
<!--                                    </form>-->
<!--                                </td>-->
                                <td>
                                    <button type="button"
                                            class="btn btn-danger delete-user-btn"
                                            th:data-user-id="${user.getId()}"
                                            th:data-user-firstname="${user.getFirstName()}"
                                            th:data-user-lastname="${user.getLastName()}"
                                            th:data-user-age="${user.getAge()}"
                                            th:data-user-email="${user.getEmail()}"
                                            data-bs-toggle="modal"
                                            data-bs-target="#deleteUserModal">
                                        Delete
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{admin/edit :: updateUserModal}"></div>
    <div th:replace="~{admin/delete :: deleteUserModal}"></div>
</body>
</html>
