<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>

    <div th:fragment="deleteUserModal">
        <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-labelledby="deleteUserModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="deleteUserModalLabel">Delete User</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <form th:method="DELETE" th:action="@{/admin}" id="deleteUserForm">
                        <div class="modal-body">
                            <div class="container-fluid">
                                <div class="row">
                                    <div class="col-3"></div>

                                    <div class="col-6 col_center">
                                        <input type="hidden" name="id" id="deleteUserId" value=""/>

                                        <div class="mb-3">
                                            <label for="deleteDisplayUserId">ID</label>
                                            <input type="text" id="deleteDisplayUserId" readonly disabled/>
                                        </div>

                                        <div class="mb-3">
                                            <label for="deleteFirstName">First Name</label>
                                            <input type="text" id="deleteFirstName" readonly disabled>
                                        </div>

                                        <div class="mb-3">
                                            <label for="deleteLastName">Last Name</label>
                                            <input type="text" id="deleteLastName" readonly disabled>
                                        </div>

                                        <div class="mb-3">
                                            <label for="deleteAge">Age</label>
                                            <input type="text" id="deleteAge" readonly disabled>
                                        </div>

                                        <div class="mb-3">
                                            <label for="deleteEmail">Email</label>
                                            <input type="text" id="deleteEmail" readonly disabled>
                                        </div>

                                        <div class="mb-3">
                                            <label for="role">Role</label> <br>
                                            <select id="role" name="role" class="form-select" size="2" readonly disabled>
                                                <div class="without_margin" th:each="role : ${roles}">
                                                    <option th:text="${role.getNameRole()}" th:value="${role.getNameRole()}"/>
                                                </div>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="col-3"></div>
                                </div>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-danger">Delete!</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
