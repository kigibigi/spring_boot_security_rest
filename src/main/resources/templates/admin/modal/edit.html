<!DOCTYPE html>
<html lang="en" xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Update user</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>


    <div th:fragment="updateUserModal">
        <div class="modal fade" id="updateUserModal" tabindex="-1" aria-labelledby="updateUserModalLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="updateUserModalLabel">Edit User</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>

                    <form th:method="PATCH" th:action="@{/admin}" id="editUserForm">
                        <input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
                        <div class="modal-body">
                            <div class="container-fluid">
                                <div class="row">
                                    <div class="col-3"></div>

                                    <div class="col-6 col_center">
                                        <input type="hidden" name="id" id="editUserId">

                                        <div class="mb-3">
                                            <label for="displayUserId">ID</label>
                                            <input type="text" id="displayUserId" readonly disabled/>
                                        </div>

                                        <div class="mb-3">
                                            <label for="firstName">First Name</label>
                                            <input type="text" name="firstName" id="firstName">
                                        </div>

                                        <div class="mb-3">
                                            <label for="lastName">Last Name</label>
                                            <input type="text" name="lastName" id="lastName">
                                        </div>

                                        <div class="mb-3">
                                            <label for="age">Age</label>
                                            <input type="number" name="age" id="age" step="1">
                                        </div>

                                        <div class="mb-3">
                                            <label for="email">Email</label>
                                            <input type="text" name="email" id="email">
                                        </div>

                                        <div class="mb-3">
                                            <label for="password">Password</label>
                                            <input type="password" name="password" id="password">
                                        </div>

                                        <div class="mb-3">
                                            <label for="role">Role</label> <br>
                                            <select id="role" name="role" class="form-select" size="2">
                                                <div class="without_margin" th:each="role : ${roles}">
                                                    <option th:text="${role.getNameRole()}" th:value="${role.getNameRole()}"/>
                                                </div>
                                            </select>
                                        </div>
                                    </div>

                                    <div class="col-3"></div>
                                </div>
                            </div>
                        </div>

                        <div class="modal-footer">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                            <button type="submit" class="btn btn-primary">Edit!</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
